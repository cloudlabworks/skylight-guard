name: Bug
description: Something in the integration or a blueprint is broken.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Home Assistant and Skylight Guard versions
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact frame, profile and event IDs and any names first.
      render: text
